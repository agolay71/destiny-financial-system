<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Connection Status</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
        .status-dot {
            width: 1rem;
            height: 1rem;
            border-radius: 50%;
            margin-right: 0.5rem;
            animation: pulse 1.5s infinite;
        }
        .status-dot.success {
            background-color: #10b981; /* Emerald 500 */
            animation: none;
        }
        .status-dot.error {
            background-color: #ef4444; /* Red 500 */
            animation: none;
        }
        .status-dot.loading {
            background-color: #3b82f6; /* Blue 500 */
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex items-center justify-center">

    <div id="connection-card" class="bg-white p-6 md:p-10 rounded-xl shadow-2xl w-full max-w-lg transition-all duration-300">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 flex items-center">
            <svg class="w-8 h-8 text-indigo-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            Live Connection Check
        </h1>

        <div class="space-y-4">
            <!-- Status Display -->
            <div class="p-4 bg-gray-50 rounded-lg border border-gray-200">
                <p class="text-sm font-medium text-gray-500 mb-1">Current Status</p>
                <div id="status-display" class="flex items-center text-xl font-semibold text-gray-700">
                    <div id="status-dot" class="status-dot loading"></div>
                    <span id="status-message">Initializing...</span>
                </div>
            </div>

            <!-- Log History -->
            <div class="bg-gray-800 text-gray-200 p-4 rounded-lg h-48 overflow-y-auto font-mono text-xs">
                <p class="text-indigo-400 mb-2">--- Connection Timeline ---</p>
                <div id="log-output"></div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Enable debug logging for Firestore
        setLogLevel('debug');

        const logOutput = document.getElementById('log-output');
        const statusMessage = document.getElementById('status-message');
        const statusDot = document.getElementById('status-dot');

        /** Logs a message to the console and the UI timeline. */
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString('en-US', { hour12: false });
            console.log(`[${timestamp}] ${message}`);

            const p = document.createElement('p');
            p.textContent = `[${timestamp}] > ${message}`;
            p.className = `py-0.5 ${type === 'error' ? 'text-red-400' : type === 'success' ? 'text-green-400' : 'text-gray-300'}`;
            logOutput.appendChild(p);
            logOutput.scrollTop = logOutput.scrollHeight;
        }

        /** Updates the main status display. */
        function updateStatus(message, state = 'loading') {
            statusMessage.textContent = message;
            statusDot.className = `status-dot ${state}`;
        }

        /** Utility to pause execution for a readable duration. */
        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        async function connectToFirebase() {
            let app, db, auth;
            let connectionStartTime = Date.now();

            try {
                // 1. Check for global configuration variables
                updateStatus("Checking Environment Configuration...", 'loading');
                
                // Retrieve global variables, defaulting to null if undefined
                const appId = typeof __app_id !== 'undefined' ? __app_id : null;
                const firebaseConfigString = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
                const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

                // Mandatory check: App ID
                if (!appId) {
                    log("MANDATORY VARIABLE MISSING: __app_id is undefined. Using 'default-app-id'.", 'error');
                    // We can proceed with a default ID, but warn the user.
                    // If the environment is not set up correctly, this will fail later.
                }

                // Mandatory check: Firebase Config
                if (!firebaseConfigString) {
                    log("MANDATORY VARIABLE MISSING: __firebase_config is undefined. Initialization will fail.", 'error');
                    throw new Error("Firebase configuration not found. Cannot proceed.");
                }
                
                // Parse the configuration string
                const firebaseConfig = JSON.parse(firebaseConfigString);

                log("Configuration loaded successfully.", 'success');
                log(`App ID: ${appId || 'default-app-id'}`);

                // 2. Initialize Firebase App
                updateStatus("Initializing Firebase App...", 'loading');
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                log("Firebase App Initialized.", 'success');

                // 3. Authenticate User
                updateStatus("Authenticating User...", 'loading');
                let userCredential;

                // The environment provides __initial_auth_token for authentication
                if (initialAuthToken) {
                    log("Attempting sign-in with Custom Token...", 'info');
                    userCredential = await signInWithCustomToken(auth, initialAuthToken);
                    log(`Signed in with Custom Token. User ID: ${userCredential.user.uid}`, 'success');
                } else {
                    log("Custom Token not found. Attempting Anonymous sign-in...", 'info');
                    userCredential = await signInAnonymously(auth);
                    log(`Signed in Anonymously. User ID: ${userCredential.user.uid}`, 'success');
                }

                const userId = auth.currentUser.uid;

                // 4. Simulate Initial Data Read (Crucial for testing connection speed)
                updateStatus("Performing initial Firestore read/write test...", 'loading');
                
                // Define the document path using the retrieved App ID and User ID
                const docPath = `/artifacts/${appId || 'default-app-id'}/users/${userId}/app_data/connection_test`;
                const docRef = doc(db, docPath);

                // Write a test document (setDoc) to ensure write permissions
                await setDoc(docRef, { timestamp: Date.now(), testId: Math.random() }, { merge: true });
                log("Successfully wrote test document (setDoc successful).", 'info');

                // Read the document (getDoc) to ensure read permissions
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    log(`Initial data read successful. Document size: ${JSON.stringify(docSnap.data()).length} bytes.`, 'success');
                } else {
                    log("Initial data read successful, but test document was empty.", 'success');
                }

                // 5. Final Success
                let connectionEndTime = Date.now();
                let totalTimeMs = connectionEndTime - connectionStartTime;

                log(`Connection established and data verified in ${totalTimeMs} ms.`, 'success');

                updateStatus(`Connected successfully! (${totalTimeMs} ms)`, 'success');

                // For readability, wait a moment before finishing
                await wait(1000); 
                updateStatus(`Ready. User ID: ${userId}`, 'success');


            } catch (error) {
                // Log detailed error to console
                console.error("FIREBASE CONNECTION ERROR:", error);
                
                // Log summarized error to UI
                log(`Failed to connect. Error: ${error.message}`, 'error');
                updateStatus("Connection Failed (Check Console)", 'error');
            }
        }

        window.onload = connectToFirebase;

    </script>
</body>
</html>

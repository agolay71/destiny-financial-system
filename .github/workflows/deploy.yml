
# Optional: Set permissions to allow GitHub Actions to create the deployment
permissions:
  contents: read
  pages: write
  id-token: write

steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20' # Use a stable Node.js version

  - name: Cache Node Modules
    uses: actions/cache@v4
    with:
      path: node_modules
      key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      restore-keys: |
        ${{ runner.os }}-node-

  - name: Install Dependencies
    # Use 'npm ci' for clean, consistent installation in CI environments
    run: npm ci

  - name: Build Project
    # This is the standard build command. Change 'build' if your package.json uses a different script (e.g., 'prod')
    run: npm run build

  - name: Setup GitHub Pages Environment
    uses: actions/configure-pages@v5

  - name: Upload Artifact
    uses: actions/upload-pages-artifact@v3
    with:
      # This assumes your built files are in the 'dist' directory.
      # Change this path if your build output is different (e.g., 'build', 'out')
      path: './dist'

  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4

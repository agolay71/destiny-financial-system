name: Deploy Static Content to GitHub Pages

on:
  # Triggers the workflow on push events to the `main` branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions needed for GitHub Pages deployment (essential for success)
permissions:
  contents: read
  pages: write
  id-token: write

# Allows only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # HIGHLY DEFENSIVE STEP: Ensure index.html is found and correctly staged in the _site directory.
      - name: Prepare Static Files
        run: |
          echo "Listing files in the repository root for debugging:"
          ls -R
          
          # 1. Create staging directory
          mkdir _site
          
          # 2. Check if the 'public' directory exists (where the file actually is)
          if [ -d "public" ]; then
            echo "Found 'public' directory. Copying contents to _site..."
            # Use cp -r public/. _site/ to copy the *contents* of public into _site
            cp -r public/. _site/
          else
            echo "Error: The 'public' directory was not found. Deployment failed."
            exit 1
          fi
          
          # 3. Final Check: Ensure index.html exists in the staging directory
          echo "Files in _site directory after staging:"
          ls -l _site/
          
          if [ ! -f _site/index.html ]; then
            echo "Error: index.html is missing in _site after copy. Deployment failed."
            exit 1
          else
            echo "index.html successfully staged in _site/"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Deployment Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Path must point to the directory containing the web files
          path: '_site' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

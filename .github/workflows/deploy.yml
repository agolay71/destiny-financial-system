# CRITICAL: These permissions are required for the deployment actions to work
permissions:
  contents: read
  pages: write
  id-token: write

steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '20'

  - name: Cache Node Modules
    uses: actions/cache@v4
    with:
      path: node_modules
      key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
      restore-keys: |
        ${{ runner.os }}-node-

  - name: Install Dependencies
    run: npm ci

  - name: Build Project
    # CRITICAL: This runs your build script. If your script is not 'build', change it here.
    run: npm run build

  - name: Setup GitHub Pages Environment
    uses: actions/configure-pages@v5

  - name: Upload Artifact
    uses: actions/upload-pages-artifact@v3
    with:
      # CRITICAL: This is the folder containing your final built files (e.g., index.html)
      path: './dist'

  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v4

name: Deploy Static Content to GitHub Pages

on:
  # Triggers the workflow on push events to the `main` branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions needed for GitHub Pages deployment (essential for success)
permissions:
  contents: read
  pages: write
  id-token: write

# Allows only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # Removed Node.js setup and mock build step, as they are unnecessary 
      # for your pre-uploaded static HTML file and were causing the failure.

      # UPDATED STEP: Create the _site folder and move the index.html file into it, 
      # handling potential case sensitivity issues to ensure the file is found.
      - name: Prepare Static Files
        run: |
          mkdir _site
          # Find the index file regardless of its casing and move it to the _site folder
          find . -maxdepth 1 -iname "index.html" -exec mv {} _site/ \;
          # Check if index.html is now in _site
          if [ ! -f _site/index.html ]; then
            echo "Error: index.html was not found or moved. Deployment will likely fail."
            # Optionally, you could exit here with an error
          else
            echo "index.html successfully staged in _site/"
          fi
          
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Deployment Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Changed path to the clean staging directory, ensuring only web content is uploaded.
          path: '_site' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
